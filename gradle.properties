android.useAndroidX=true
android.enableJetifier=true
# Each module gets its own R class — speeds up incremental builds and
# prevents accidental access to library-internal resources.
android.nonTransitiveRClass=true
# R8 full-mode keeps the most aggressive optimisations on by default in
# AGP 8.x. Explicit here so build behaviour doesn't drift between machines.
android.enableR8.fullMode=true
# Kotlin code style hint for IDEs and Gradle's Kotlin DSL — official style
# matches the rest of the codebase.
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8