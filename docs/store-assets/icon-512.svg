<?xml version="1.0" encoding="UTF-8"?>
<!--
  Play Store launcher icon, 512x512.
  Mirrors the in-app adaptive icon: radial-gradient navy background +
  centered Material favorite heart in Healthify green (#1AD9A0).
  The faint outer glow ring matches the in-app foreground vector.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#111E30"/>
      <stop offset="100%" stop-color="#070D1A"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Soft green halo behind the heart -->
  <circle cx="256" cy="256" r="170" fill="#1AD9A0" fill-opacity="0.12"/>
  <!-- Material favorite heart, scaled to fill ~50% of canvas -->
  <g transform="translate(256 256) scale(11.5) translate(-12 -12)">
    <path fill="#1AD9A0"
          d="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5
             C2,5.42 4.42,3 7.5,3
             c1.74,0 3.41,0.81 4.5,2.09
             C13.09,3.81 14.76,3 16.5,3
             C19.58,3 22,5.42 22,8.5
             c0,3.78 -3.4,6.86 -8.55,11.54
             L12,21.35z"/>
  </g>
</svg>
